# Mesmo arquivo para produção e para uso local:
#   produção (CI/CD):  docker compose pull && docker compose up -d   (imagens do GHCR)
#   local:             docker compose up -d --build                  (build a partir do código)
# Variáveis: .env na raiz (compose) e backend/.env (aplicação). Veja DOCKER.md.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  mongo:
    <<: *hardening
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:?defina MONGO_USER no .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    networks: [db]

  backend:
    <<: *hardening
    image: "${IMAGE_PREFIX:-ghcr.io/profdiegocbcastro/maf-site}-backend:${IMAGE_TAG:-latest}"
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      DB_NAME: "${DB_NAME:-maf_database}"
      FRONTEND_URL: "${SERVER_URL:-http://localhost}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy
    networks: [db, web]

  frontend:
    <<: *hardening
    image: "${IMAGE_PREFIX:-ghcr.io/profdiegocbcastro/maf-site}-frontend:${IMAGE_TAG:-latest}"
    build: ./frontend
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:-localhost}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-127.0.0.1/32}"
    ports:
      - "${PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /etc/nginx/conf.d
      - /etc/nginx/certs
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

volumes:
  mongo_data:

networks:
  # Mongo fica numa rede interna, sem saída para a internet e sem porta publicada
  db:
    internal: true
  web:
